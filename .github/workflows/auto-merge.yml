name: Auto Merge A to B

on:
  push:
    branches:
      - test-env-a

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_TITLE: "[test]"
      BASE_BRANCH: test-env-b

    steps:
      # ✅ test-env-b を checkout（マージ先）
      - name: Checkout test-env-b
        uses: actions/checkout@v4
        with:
          ref: test-env-b
          fetch-depth: 0

      # ✅ Git 設定
      - name: Set up Git
        run: |
          git config user.name "yannsugi"
          git config user.email "yannsugi966@gmail.com"

      # ✅ test-env-a を dry-run マージして conflict 検知
      - name: Check merge conflict
        id: merge_check
        run: |
          git fetch origin test-env-a
          if git merge --no-commit --no-ff origin/test-env-a; then
            echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
          fi

      # ✅ conflict が起きたときだけ、状態を戻す
      - name: Reset merge state
        run: git reset --merge || true

      # ✅ conflict なければ即マージして終了🎉
      - name: Auto-merge if no conflict
        if: steps.merge_check.outputs.has_conflict == 'false'
        run: |
          git merge origin/test-env-a --no-edit
          git push origin test-env-b

      # # ✅ conflict がある場合は PR を作成
      # - name: Create PR if conflict
      #   if: steps.merge_check.outputs.has_conflict == 'true'
      #   id: create_pr
      #   uses: peter-evans/create-pull-request@v6
      #   with:
      #     commit-message: "Conflict PR: test-env-a → test-env-b"
      #     title: "🔀 Conflict: Merge test-env-a into test-env-b"
      #     branch: auto-merge/test-env-a-to-test-env-b
      #     body: |
      #       ⚠️ 自動マージに失敗しました。
      #       `test-env-a` → `test-env-b` のマージにコンフリクトがあります。
      #       手動で解消してください。

      - name: Create PR
        if: steps.merge_check.outputs.has_conflict == 'true'
        id: create_pr
        run: |
          gh pr create --base test-env-b --head test-env-a --title "test" -body "testdayo"

