name: Auto Merge A to B

on:
  push:
    branches:
      - test-env-a

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_TITLE: "[Conflict] test-env-a -> test-env-b"
      BASE_BRANCH: test-env-b

    steps:
      - name: Checkout target branch (test-env-b)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          # git config user.name "github-actions[bot]"
          # git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "yannsugi"
          git config user.email "yannsugi966@gmail.com"

      - name: Fetch source branch (test-env-a)
        run: |
          git fetch origin test-env-a:test-env-a

      - name: Check merge conflict
        id: merge_check
        run: |
          if git merge --no-commit --no-ff test-env-a; then
            echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset merge state
        run: git reset --merge || true

      # ✅ Conflict がなければ自動マージ
      - name: Auto-merge if no conflict
        if: steps.merge_check.outputs.has_conflict == 'false'
        run: |
          git merge test-env-a --no-edit
          git push origin ${{ env.BASE_BRANCH }}

      # ✅ Conflict がある場合は対応用ブランチを作成して PR を作成
      - name: Create conflict resolution branch and PR
        if: steps.merge_check.outputs.has_conflict == 'true'
        run: |
          BRANCH_NAME=auto/conflict-fix-$(date +%s)
          git checkout -b $BRANCH_NAME origin/test-env-a
          git push origin $BRANCH_NAME

          # --reviewer yann \ bad
          # --reviewer yannsugi \ good

          gh pr create \
            --base ${{ env.BASE_BRANCH }} \
            --head $BRANCH_NAME \
            --title "${{ env.PR_TITLE }}" \
            --reviewer yannsugi \
            --body "Auto-generated PR due to merge conflict between test-env-a and test-env-b."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
