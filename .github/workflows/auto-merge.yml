name: Auto Merge Downstream with Output Flag

on:
  push:
    branches:
      - test-env-a
      - test-env-b

jobs:
  merge-downstream:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - from: test-env-a
            to: test-env-b
          - from: test-env-b
            to: test-env-c

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "yannsugi"
          git config user.email "yannsugi966@gmail.com"

      - name: Fetch and check out target branch
        run: |
          git fetch origin ${{ matrix.to }}
          git checkout ${{ matrix.to }}

      - id: merge
        run: |
          if git merge origin/${{ matrix.from }} --no-edit; then
            echo "has_conflict=false" >> $GITHUB_OUTPUT
          else
            echo "has_conflict=true" >> $GITHUB_OUTPUT
          fi

      - name: Push if merge successful
        if: steps.merge.outputs.has_conflict == 'false'
        run: git push origin ${{ matrix.to }}

      - name: Create PR if conflict
        if: steps.merge.outputs.has_conflict == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Conflict: Merge ${{ matrix.from }} → ${{ matrix.to }}"
          commit-message: "Auto PR due to conflict"
          base: ${{ matrix.to }}
          branch: "auto-merge/${{ matrix.from }}-to-${{ matrix.to }}"
          body: |
            ⚠️ This PR was created automatically because a merge conflict occurred
            while trying to merge `${{ matrix.from }}` into `${{ matrix.to}`.
            Please resolve the conflict manually.
