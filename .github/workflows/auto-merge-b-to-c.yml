name: Trigger Auto Merge B to C

on:
  workflow_dispatch:
  push:
    branches:
      - test-env-b

jobs:
  trigger-child:
    runs-on: ubuntu-latest

    steps:
      - name: Call child workflow (Auto Merge)
        run: |
          gh workflow run 
            "auto-merge.yml" \
            -f from_branch=test-env-b \
            -f to_branch=test-env-c \
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
