name: Auto Merge A to B

on:
  push:
    branches:
      - test-env-a

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: "[Conflict] test-env-a -> test-env-b"
      BASE_BRANCH: test-env-b
      NEXT_WORKFLOW: auto-merge-b-to-c.yml
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 必要に応じて PERSONAL_TOKEN に差し替え

    steps:
      - name: Checkout base branch (test-env-b)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branch (test-env-a)
        run: |
          git fetch origin test-env-a:test-env-a

      - name: Check for merge conflicts
        id: merge_check
        run: |
          echo "🔍 Checking for conflicts..."
          if git merge --no-commit --no-ff test-env-a; then
            echo "✅ No conflict"
            echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Conflict detected"
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset merge state
        run: git reset --merge || true

      - name: Auto-merge if no conflict
        if: steps.merge_check.outputs.has_conflict == 'false'
        run: |
          echo "🚀 Performing auto-merge and pushing to ${{ env.BASE_BRANCH }}"
          git merge --no-edit test-env-a
          git push origin ${{ env.BASE_BRANCH }}

      - name: Trigger next workflow (test-env-b → test-env-c)
        if: steps.merge_check.outputs.has_conflict == 'false'
        run: |
          echo "🚀 Triggering next workflow: ${{ env.NEXT_WORKFLOW }}"
          gh workflow run \
            "${{ env.NEXT_WORKFLOW }}" \
            --ref ${{ env.BASE_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create conflict resolution branch and PR
        if: steps.merge_check.outputs.has_conflict == 'true'
        run: |
          BRANCH_NAME=auto/conflict-fix-$(date +%s)
          git checkout -b $BRANCH_NAME origin/test-env-a
          git push origin $BRANCH_NAME

          echo "🔧 Creating PR for manual conflict resolution"
          gh pr create \
            --base ${{ env.BASE_BRANCH }} \
            --head $BRANCH_NAME \
            --title "${{ env.PR_TITLE }}" \
            --reviewer yannsugi \
            --body "Auto-generated PR due to merge conflict between test-env-a and test-env-b."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
